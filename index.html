<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace: data structures and algorithms, step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#E9EFF4;--grid:rgba(46,92,138,.10);--grid2:rgba(46,92,138,.05);
  --ink:#15263A;--muted:#5A6C80;--panel:#F7FAFC;--line:#C6D3DF;--box:#FFFFFF;
  --ptr:#D9472F;--edge:#6F8296;
  --a:#F5BC45;--a2:#A97A10;  --c:#BDB0FB;--c2:#6A52DE;  --f:#86D7A8;--f2:#2B8F5D;
  --d:#F6A2A3;--d2:#C93C42;  --v:#A7D1F2;--v2:#2D7BBB;  --o:#DCE5EE;--o2:#94A9BD;  --n:#84DDD3;--n2:#1A988A;
  --cell-ink:#14202C;
  --sq1:#F4F7FA;--sq2:#CFDBE6;--land:#9AD4A9;--water:#C2DEF1;
  --codebg:#13202D;--codeink:#D5E1EC;--codemut:#6F8499;--codeon:rgba(245,188,69,.18);
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --dur:600ms;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1620;--grid:rgba(140,180,220,.08);--grid2:rgba(140,180,220,.035);
  --ink:#DCE6EF;--muted:#8DA0B3;--panel:#132030;--line:#24364A;--box:#1A2939;
  --ptr:#FF7A5C;--edge:#7F93A8;--o:#2A3B4D;--o2:#4D6278;
  --sq1:#1B2A3A;--sq2:#2A3E52;--land:#4F9A66;--water:#24435C;
  --codebg:#0A121A;
}}
:root[data-theme="dark"]{
  --paper:#0D1620;--grid:rgba(140,180,220,.08);--grid2:rgba(140,180,220,.035);
  --ink:#DCE6EF;--muted:#8DA0B3;--panel:#132030;--line:#24364A;--box:#1A2939;
  --ptr:#FF7A5C;--edge:#7F93A8;--o:#2A3B4D;--o2:#4D6278;
  --sq1:#1B2A3A;--sq2:#2A3E52;--land:#4F9A66;--water:#24435C;
  --codebg:#0A121A;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ptr);outline-offset:2px}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:28px 18px 28px 22px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}
.brand h1{font-size:34px;line-height:1;margin:0;font-weight:800;letter-spacing:-.03em}
.brand h1 span{display:inline-block;width:.42em;height:.42em;border:3px solid var(--ptr);border-radius:50%;margin-left:4px;vertical-align:.12em}
.brand p{margin:8px 0 22px;color:var(--muted);font-size:14px;line-height:1.4}
#nav h3{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 6px}
#nav ul{list-style:none;margin:0;padding:0}
#nav button{all:unset;box-sizing:border-box;display:block;width:100%;padding:7px 10px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}
#nav button .t{display:block;font-weight:600;font-size:15px;line-height:1.25}
#nav button .s{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
#nav button:hover{background:var(--grid2)}
#nav button[aria-current="true"]{background:var(--grid);border-left-color:var(--ptr)}
#nav button:focus-visible{outline:2px solid var(--ptr)}

main{padding:28px 32px 48px;min-width:0}
.mnav{display:none}
.topic{max-width:76ch}
.kind{font-size:13px;color:var(--muted);font-weight:600}
#title{font-size:clamp(34px,5vw,56px);line-height:1;margin:4px 0 10px;font-weight:800;letter-spacing:-.035em}
#blurb{margin:0;color:var(--muted);font-size:16.5px;max-width:68ch}

.ops{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;margin:22px 0 8px}
#opTabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel);flex-wrap:wrap}
#opTabs[hidden]{display:none}
#opTabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
#opTabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
#fields{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{background:var(--box);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:96px;font-size:15px;color:var(--ink);font-weight:400}
.fld.wide input{width:min(330px,70vw)}
.fld textarea{font-family:var(--mono);width:150px;line-height:1.3;resize:vertical}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:9px;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn[hidden]{display:none}
#cx{font-size:13px;color:var(--muted);margin:0 0 4px}
#err{color:var(--d2);font-weight:600;min-height:1.5em;font-size:14.5px}

.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:20px;align-items:start}
.stagewrap{min-width:0}
#stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:48px 48px,48px 48px,12px 12px,12px 12px;height:clamp(260px,50vh,470px);scroll-margin-top:12px}
#svg{width:100%;height:100%;display:block}
.narr{display:flex;flex-direction:column;gap:8px;margin-top:12px;min-height:84px}
#cap{margin:0;font-size:17px;line-height:1.45;font-weight:600;max-width:72ch}
#vars{display:flex;flex-wrap:wrap;gap:6px}
.var{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.var i{font-style:normal;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.ctrl .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
.ctrl .ib:disabled{opacity:.35;cursor:default}
.ctrl #play{width:52px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prog{flex:1 1 140px;min-width:120px;display:flex;flex-direction:column;gap:4px}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
#bar{height:100%;background:var(--ptr);width:0;transition:width .25s}
#count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.speed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.speed input{accent-color:var(--ptr);width:96px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid}

.codecard{background:var(--codebg);color:var(--codeink);border-radius:14px;overflow:hidden;position:sticky;top:16px}
.codehead{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;color:var(--codemut);border-bottom:1px solid rgba(255,255,255,.07)}
#code{font-family:var(--mono);font-size:12.8px;line-height:1.7;padding:10px 0;max-height:min(62vh,560px);overflow:auto}
.ln .src{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.ln{display:flex;white-space:pre;padding:0 14px 0 0;border-left:3px solid transparent;transition:background .2s}
.ln .no{width:34px;flex:none;text-align:right;padding-right:12px;color:var(--codemut);user-select:none}
.ln.on{background:var(--codeon);border-left-color:#F5BC45}
.ln.on .no{color:#F5BC45}
#code b{font-weight:400}#code b.k{color:#F59FB4}#code b.s{color:#A6E3A1}#code b.d{color:#F9C77A}#code b.t{color:#8CC8F5}#code b.c{color:#71879B;font-style:italic}
.ln.cur{background:rgba(255,255,255,.045)}
.spot{margin:14px 0 0;padding:11px 16px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:70ch}
.spot[hidden]{display:none}
.spot h4{margin:0 0 5px;font-size:14px;font-weight:700}
.spot ul{margin:0;padding-left:18px;font-size:15px;line-height:1.45}
.spot li+li{margin-top:3px}
.twin{all:unset;display:inline-block;cursor:pointer;margin-top:10px;font-size:14.5px;font-weight:600;color:var(--ptr);text-decoration:underline;text-underline-offset:3px}
.twin[hidden]{display:none}
.twin:focus-visible{outline:2px solid var(--ptr);outline-offset:3px}
.kbd{font-size:12px;color:var(--muted);margin-top:10px}

/* ---------- SVG nodes ---------- */
#svg text{font-family:var(--font);fill:var(--ink)}
.n{transition:opacity var(--dur) ease}
.n.enter,.n.leave{opacity:0}
.n rect,.n circle.body{fill:var(--box);stroke:var(--ink);stroke-width:2;transition:fill var(--dur) ease,stroke var(--dur) ease,opacity var(--dur) ease}
.n circle.ring{fill:none;stroke:var(--ink);stroke-width:1.5}
.n .lbl{text-anchor:middle;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.k-circ .lbl{font-size:16px}
.k-txt text{font-size:13px}
.k-txt .idx{fill:var(--muted);font-size:12px}
.k-txt .note{fill:var(--muted);font-size:13px}
.k-txt .null{fill:var(--muted);font-family:var(--mono);font-size:13px}
.k-tag polygon{fill:var(--ptr)}
.k-tag text{fill:var(--ptr)!important;font-weight:800;font-size:14px}
.st-slot rect{fill:none;stroke:var(--o2);stroke-dasharray:4 4;stroke-width:1.5}
.st-active rect,.st-active circle.body{fill:var(--a);stroke:var(--a2)}
.st-cmp rect,.st-cmp circle.body{fill:var(--c);stroke:var(--c2)}
.st-found rect,.st-found circle.body{fill:var(--f);stroke:var(--f2)}
.st-del rect,.st-del circle.body{fill:var(--d);stroke:var(--d2)}
.st-visit rect,.st-visit circle.body{fill:var(--v);stroke:var(--v2)}
.st-done rect,.st-done circle.body{fill:var(--o);stroke:var(--o2)}
.st-new rect,.st-new circle.body{fill:var(--n);stroke:var(--n2)}
:is(.st-active,.st-cmp,.st-found,.st-del,.st-visit,.st-new) .lbl{fill:var(--cell-ink)!important}
.st-dim{opacity:.3}
.st-root circle.body{fill:var(--ink)} .st-root .lbl{fill:var(--paper)!important}
.st-bucket rect{fill:var(--ink);stroke:var(--ink)} .st-bucket .lbl{fill:var(--paper)!important;font-size:15px!important}
.st-bucket.st-active rect{fill:var(--a);stroke:var(--a2)} .st-bucket.st-active .lbl,.st-bucket.st-found .lbl,.st-bucket.st-cmp .lbl{fill:var(--cell-ink)!important}
.st-bucket.st-found rect{fill:var(--f);stroke:var(--f2)} .st-bucket.st-cmp rect{fill:var(--c);stroke:var(--c2)}
.st-sq1 rect{fill:var(--sq1);stroke:var(--sq2);stroke-width:1} .st-sq2 rect{fill:var(--sq2);stroke:var(--sq2);stroke-width:1}
.st-queen rect{fill:none;stroke:none} .st-queen .lbl{font-size:30px!important;fill:var(--ink)!important}
.st-queen.st-active .lbl{fill:var(--a2)!important} .st-queen.st-found .lbl{fill:var(--f2)!important} .st-queen.st-del .lbl{fill:var(--d2)!important}
.st-land rect{fill:var(--land);stroke:none} .st-water rect{fill:var(--water);stroke:none}
.st-isl1 rect{fill:#F5BC45;stroke:#A97A10} .st-isl2 rect{fill:#BDB0FB;stroke:#6A52DE} .st-isl3 rect{fill:#F6A2A3;stroke:#C93C42} .st-isl4 rect{fill:#84DDD3;stroke:#1A988A}
[class*="st-isl"] .lbl{fill:var(--cell-ink)!important;font-size:14px!important}
.k-band rect{transition:fill var(--dur),stroke var(--dur)}
.k-band .lbl{font-size:12.5px;font-weight:600}
.st-well rect{fill:var(--grid2);stroke:var(--line);stroke-width:1.5}
.st-win rect{fill:rgba(245,188,69,.16);stroke:var(--a2);stroke-width:2;stroke-dasharray:6 4}
.st-bad rect{fill:rgba(246,162,163,.2);stroke:var(--d2);stroke-width:2;stroke-dasharray:6 4}
.st-win2 rect{fill:rgba(189,176,251,.18);stroke:var(--c2);stroke-width:2;stroke-dasharray:6 4}
.k-txt .wt{font-weight:700;font-size:13px;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
#le .st-gone{opacity:.22} #le .ah.st-gone{opacity:.22}
.st-cursor rect{fill:none;stroke:var(--ptr);stroke-width:3.5}
.st-axis rect{fill:var(--muted)}
.st-iv rect{fill:var(--box);stroke:var(--ink);stroke-width:1.5}
.st-cmpb rect{fill:var(--c);stroke:var(--c2);stroke-width:1.5} .st-cmpb .lbl{fill:var(--cell-ink)!important}
.st-done.k-band rect{fill:var(--o);stroke:var(--o2);stroke-width:1.5}
.st-mg rect{fill:var(--ink);stroke:var(--ink)} .st-mg .lbl{fill:var(--paper)!important}
.st-mgnew rect{fill:var(--f);stroke:var(--f2);stroke-width:2} .st-mgact rect{fill:var(--a);stroke:var(--a2);stroke-width:2}
.st-mgnew .lbl,.st-mgact .lbl{fill:var(--cell-ink)!important}
#le path{fill:none;stroke:var(--edge);stroke-width:2.2}
#le .ah{fill:var(--edge)}
#le .st-tree{stroke:var(--v2);stroke-width:4} #le .ah.st-tree{fill:var(--v2)}
#le .st-cmp{stroke:var(--c2);stroke-width:4} #le .ah.st-cmp{fill:var(--c2)}
#le .st-new{stroke:var(--n2);stroke-width:3.5} #le .ah.st-new{fill:var(--n2)}
#le .st-del{stroke:var(--d2);stroke-width:3;stroke-dasharray:6 5} #le .ah.st-del{fill:var(--d2)}

@media (max-width:1180px){.work{grid-template-columns:1fr}.codecard{position:static}#code{max-height:none}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 16px 40px}
  .mnav{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .mnav b{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .mnav select{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600}
  #stage{height:clamp(230px,44vh,380px)}
  #cap{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.n,.n rect,.n circle,.ln,#bar{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Topics">
    <div class="brand"><h1>Trace<span aria-hidden="true"></span></h1><p>Data structures and algorithms, one step at a time.</p></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="mnav"><b>Trace</b><label class="sr" for="mnav" style="position:absolute;left:-9999px">Topic</label><select id="mnav"></select></div>
    <header class="topic">
      <div class="kind" id="kind"></div>
      <h2 id="title"></h2>
      <p id="blurb"></p>
      <div class="spot" id="spot" hidden><h4 id="spotH"></h4><ul id="spotL"></ul></div>
      <button type="button" class="twin" id="twin" hidden></button>
    </header>
    <section class="ops" aria-label="Operation">
      <div id="opTabs" role="tablist" aria-label="Operations"></div>
      <div id="fields"></div>
      <button class="btn" id="run" type="button">Run</button>
      <button class="btn ghost" id="resetData" type="button">Reset data</button>
    </section>
    <p id="cx"></p>
    <div id="err" role="alert"></div>
    <div class="work">
      <div class="stagewrap">
        <div id="stage"><svg id="svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated diagram"><g id="lb"></g><g id="le"></g><g id="ln"></g></svg></div>
        <div class="narr" aria-live="polite"><p id="cap"></p><div id="vars"></div></div>
        <div class="ctrl">
          <button class="ib" id="first" type="button" aria-label="First step"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
          <button class="ib" id="prev" type="button" aria-label="Previous step"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5v14L6 12z" fill="currentColor"/></svg></button>
          <button class="ib" id="play" type="button" aria-label="Play"></button>
          <button class="ib" id="next" type="button" aria-label="Next step"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 5v14l9-7z" fill="currentColor"/></svg></button>
          <button class="ib" id="last" type="button" aria-label="Last step"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg></button>
          <div class="prog"><div class="track"><div id="bar"></div></div><span id="count"></span></div>
          <label class="speed">Speed <input id="speed" type="range" min="1" max="5" value="3"></label>
        </div>
        <div class="legend" aria-label="Color key">
          <span><i style="background:var(--a);border-color:var(--a2)"></i>current</span>
          <span><i style="background:var(--c);border-color:var(--c2)"></i>comparing</span>
          <span><i style="background:var(--n);border-color:var(--n2)"></i>new</span>
          <span><i style="background:var(--f);border-color:var(--f2)"></i>found or result</span>
          <span><i style="background:var(--d);border-color:var(--d2)"></i>removed or ruled out</span>
          <span><i style="background:var(--v);border-color:var(--v2)"></i>visited</span>
        </div>
      </div>
      <div class="codecard"><div class="codehead"><span id="codehead">Java</span></div><div id="code"></div></div>
    </div>
    <p class="kbd">Keyboard: ← and → step through, space plays and pauses.</p>
  </main>
</div>
<script>
/* ===== core: scene primitives + step recorder ===== */
const BW = 48, STEP = 56;
function box(key, x, y, label, o = {}) {
  return { key, kind: 'box', x, y, w: o.w || BW, h: o.h || BW, label: label == null ? '' : String(label), st: o.st || '', from: o.from, fs: o.fs };
}
function circ(key, x, y, label, o = {}) {
  const r = o.r || 22;
  return { key, kind: 'circ', x, y, w: r * 2, h: r * 2, r, label: String(label), st: o.st || '', from: o.from, ring: !!o.ring };
}
function tag(key, x, y, label, o = {}) {
  return { key, kind: 'tag', x, y, w: 8, h: 8, label: String(label), st: o.st || '', dir: o.dir || 'down' };
}
function txt(key, x, y, label, o = {}) {
  label = String(label);
  return { key, kind: 'txt', x, y, w: label.length * 7 + 8, h: 16, label, cls: o.cls || '', anchor: o.anchor || 'middle', from: o.from };
}
function band(key, x, y, w, h, o = {}) {
  return { key, kind: 'band', x, y, w, h, st: o.st || '', label: o.label || '', from: o.from };
}
function edge(from, to, o = {}) {
  return { from, to, arrow: o.arrow !== false, st: o.st || '', fa: o.fa, ta: o.ta, curve: o.curve || 0 };
}
/* pointer tags stacked when several point at the same thing */
function tagsAt(map, posOf, prefix, dy, dir) {
  const out = [], count = {};
  dir = dir || (dy < 0 ? 'down' : 'up');
  for (const [name, ref] of Object.entries(map || {})) {
    if (ref == null || ref === false) continue;
    const p = posOf(ref); if (!p) continue;
    const k = String(ref), c = count[k] || 0; count[k] = c + 1;
    const sgn = dir === 'down' ? -1 : 1;

(function () {
  const SIZE = 7, BX = 50, BY0 = 40, BDY = 50, CX0 = 150, CDX = 76, MAXC = 6;
  const by = b => BY0 + b * BDY;
  function scene(m, o = {}) {
    const nodes = [], edges = [];
    for (let b = 0; b < SIZE; b++) {
      nodes.push(box('b' + b, BX, by(b), b, { w: 56, h: 38, st: 'bucket' + ((o.bst || {})[b] ? ' ' + o.bst[b] : '') }));
      const ch = m.table[b]; let prev = 'b' + b;
      ch.forEach((k, j) => {
        nodes.push(box('h' + k, CX0 + j * CDX, by(b), k, { w: 54, h: 36, st: (o.st || {})[k] || '', from: (o.from || {})[k] }));
        edges.push(edge(prev, 'h' + k, { fa: 'r', ta: 'l' })); prev = 'h' + k;
      });
    }
    if (o.extra) nodes.push(...o.extra);
    return { w: CX0 + (MAXC - 1) * CDX + 50, h: by(SIZE - 1) + 44, nodes, edges };
  }
  const hv = k => ({ 'h(key)': `${k} % ${SIZE} = ${((k % SIZE) + SIZE) % SIZE}` });
  MODS.push({
    id: 'hashtable', group: 'ds', title: 'Hash table', sub: 'insert, search, delete',
    blurb: 'A hash function turns each key into a bucket number, so lookups jump straight to one small chain instead of scanning everything. Keys that land in the same bucket are chained together.',
    init() { const table = Array.from({ length: SIZE }, () => []);[14, 22, 8, 31, 12, 19].forEach(k => table[((k % SIZE) + SIZE) % SIZE].push(k)); return { table }; },
    view: m => scene(m),
    code: `
static final int SIZE = 7;
List<List<Integer>> table;  // SIZE empty chains

int h(int key) {
    return key % SIZE;                    ⟨h⟩
}

void insert(int key) {
    List<Integer> chain = table.get(h(key));
    for (int k : chain)                   ⟨scan⟩
        if (k == key) return;             ⟨dup⟩
    chain.add(key);                       ⟨app⟩
}

boolean search(int key) {
    for (int k : table.get(h(key)))       ⟨sscan⟩
        if (k == key) return true;        ⟨sfound⟩
    return false;                         ⟨snf⟩
}

void delete(int key) {
    List<Integer> chain = table.get(h(key));
    int i = chain.indexOf(key);           ⟨dscan⟩
    if (i >= 0) chain.remove(i);          ⟨drem⟩
}`,
    ops: [
      { id: 'insert', label: 'Insert', cx: 'Average O(1), worst O(n) if everything collides', fields: [{ id: 'key', label: 'Key', type: 'num', def: 29 }] },
      { id: 'search', label: 'Search', cx: 'Average O(1)', fields: [{ id: 'key', label: 'Key', type: 'num', def: 31 }] },
      { id: 'delete', label: 'Delete', cx: 'Average O(1)', fields: [{ id: 'key', label: 'Key', type: 'num', def: 8 }] }
    ],
    run(m, op, v, R) {
      const k = v.key;
      if (!Number.isInteger(k) || k < 0 || k > 999) return 'Use a whole-number key from 0 to 999.';
      const b = k % SIZE, ch = m.table[b];
      const scanLine = op === 'insert' ? 'scan' : op === 'search' ? 'sscan' : 'dscan';
      R.add(`Hash the key: ${k} % ${SIZE} = ${b}. Go straight to bucket ${b}.`, 'h', scene(m, { bst: { [b]: 'active' } }), { key: k, ...hv(k) });
      let found = -1;
      for (let j = 0; j < ch.length; j++) {
        const hit = ch[j] === k;
        R.add(`Compare ${ch[j]} with ${k}: ${hit ? 'match.' : 'no match.'}`, scanLine, scene(m, { bst: { [b]: 'active' }, st: { [ch[j]]: hit ? 'found' : 'cmp' } }), { key: k, ...hv(k) });
        if (hit) { found = j; break; }
      }
      if (op === 'insert') {
        if (found >= 0) { R.add(`${k} is already in the table, so nothing changes.`, 'dup', scene(m, { st: { [k]: 'found' } }), { key: k }); return; }
        if (ch.length >= MAXC) return `Bucket ${b} is full in this demo. Try a key that hashes elsewhere.`;
        ch.push(k);
        R.add(ch.length > 1 ? `Collision: bucket ${b} already has keys, so ${k} is appended to its chain.` : `Bucket ${b} was empty. ${k} becomes its first entry.`, 'app', scene(m, { bst: { [b]: 'active' }, st: { [k]: 'new' }, from: { [k]: { y: by(b) - 60 } } }), { key: k, ...hv(k) });
        R.add('Done.', 'app', scene(m), { key: k });
      } else if (op === 'search') {
        if (found >= 0) R.add(`Found ${k} in bucket ${b}. We only looked at one bucket, not the whole table.`, 'sfound', scene(m, { st: { [k]: 'found' } }), { result: 'true' });
        else R.add(`Reached the end of bucket ${b}'s chain. ${k} isn't stored.`, 'snf', scene(m, { bst: { [b]: 'active' } }), { result: 'false' });
      } else {
        if (found < 0) { R.add(`${k} isn't in bucket ${b}, so there is nothing to delete.`, 'dscan', scene(m), { result: 'not found' }); return; }
        R.add(`Remove ${k} from the chain.`, 'drem', scene(m, { st: { [k]: 'del' } }));
        ch.splice(found, 1);
        R.add('Done. The rest of the chain closes the gap.', 'drem', scene(m));
      }
    }
  });
})();

(function () {
  const GAPX = 54, DY = 64, Y0 = 40, W = 860, MAXN = 15, MAXD = 6;
  function layout(m) {
    const pos = {}; let r = 0, md = 0;

    const x0 = centerX0(r, W, GAPX); for (const id in pos) pos[id].x = x0 + pos[id].rank * GAPX;
    return { pos, n: r, md };
  }

      if (n.l != null) edges.push(edge('n' + id, 'n' + n.l, { arrow: false, st: (o.est || {})[n.l] || '' }));
      if (n.r != null) edges.push(edge('n' + id, 'n' + n.r, { arrow: false, st: (o.est || {})[n.r] || '' }));
    }
    nodes.push(...tagsAt(o.tags, id => pos[id] ? { x: pos[id].x, y: pos[id].y } : null, 't_', -30));
    if (o.out) {
      nodes.push(txt('olbl', 30, outY, 'output', { cls: 'note', anchor: 'start' }));
      o.out.forEach((id, k) => nodes.push(box('o' + id, 110 + k * 50, outY, m.nodes[id].v, { w: 44, h: 36, st: 'found', from: pos[id] ? { x: pos[id].x, y: pos[id].y } : null })));
    }
    if (o.extra) nodes.push(...o.extra);

  }
  MODS.push({
    id: 'bst', group: 'ds', title: 'Binary search tree', sub: 'insert, search, in-order',
    blurb: 'Every node keeps smaller values in its left subtree and larger ones in its right. Each comparison throws away half of what is left, as long as the tree stays balanced.',
    init() { const m = { nodes: {}, root: null, nid: 0 };[50, 30, 70, 20, 40, 60, 80].forEach(k => ins(m, k)); return m; },
    view: m => scene(m),
    ops: [
      { id: 'insert', label: 'Insert', cx: 'O(h): O(log n) balanced, O(n) worst', fields: [{ id: 'key', label: 'Key', type: 'num', def: 45 }], code: `
Node insert(Node root, int key) {
    if (root == null)
        return new Node(key);                     ⟨new⟩
    if (key < root.val)
        root.left = insert(root.left, key);       ⟨goL⟩
    else if (key > root.val)
        root.right = insert(root.right, key);     ⟨goR⟩
    return root; // equal keys are ignored        ⟨ret⟩
}` },
      { id: 'search', label: 'Search', cx: 'O(h): O(log n) balanced', fields: [{ id: 'key', label: 'Find', type: 'num', def: 60 }], code: `
Node search(Node root, int key) {
    while (root != null) {
        if (key == root.val)
            return root;                  ⟨found⟩
        if (key < root.val)
            root = root.left;             ⟨goL⟩
        else
            root = root.right;            ⟨goR⟩
    }
    return null;                          ⟨nf⟩
}` },
      { id: 'inorder', label: 'In-order walk', cx: 'Time O(n), space O(h)', fields: [], code: `
void inorder(Node node) {
    if (node == null)
        return;                           ⟨none⟩
    inorder(node.left);                   ⟨left⟩
    System.out.println(node.val);         ⟨visit⟩
    inorder(node.right);                  ⟨right⟩
}` }
    ],
    run(m, op, v, R) {
      if (op === 'insert') {
        const k = v.key;
        if (Object.keys(m.nodes).length >= MAXN) return `This demo holds up to ${MAXN} nodes. Reset the data to start over.`;
        if (depthOf(m, k) > MAXD) return 'That key would make the tree too deep to draw here. Try a value closer to the middle.';
        if (m.root == null) { ins(m, k); R.add(`The tree is empty, so ${k} becomes the root.`, 'new', scene(m, { st: { [m.root]: 'new' } })); return; }

          const left = k < n.v, nx = left ? n.l : n.r;
          R.add(`${k} ${left ? '<' : '>'} ${n.v}, so go ${left ? 'left' : 'right'}.`, left ? 'goL' : 'goR', scene(m, { st: { [c]: 'cmp' }, tags: { cur: c } }), { key: k, node: n.v });
          if (nx == null) {
            const id = m.nid++; m.nodes[id] = { v: k, l: null, r: null }; if (left) n.l = id; else n.r = id;

          const left = k < n.v;
          R.add(`${k} ${left ? '<' : '>'} ${n.v}: the answer can only be in the ${left ? 'left' : 'right'} subtree.`, left ? 'goL' : 'goR', scene(m, { st: { [c]: 'cmp' }, tags: { cur: c } }), { key: k, compared: seen });
          c = left ? n.l : n.r;
        }
        R.add(`Hit an empty spot. ${k} isn't in the tree.`, 'nf', scene(m), { result: 'null' });
      } else {
        if (m.root == null) return 'The tree is empty.';
        const out = [], st = {};
        const go = id => {
          if (id == null) return;
          const n = m.nodes[id]; st[id] = 'active';

          go(n.l);

          go(n.r);
          st[id] = 'done';
        };
        go(m.root);
        R.add('Done. An in-order walk of a BST prints the keys in sorted order.', 'right', scene(m, { st, out }), { printed: out.map(i => m.nodes[i].v).join(' ') });
      }
    }
  });
  function ins(m, k) {
    const id = m.nid++; m.nodes[id] = { v: k, l: null, r: null };
    if (m.root == null) { m.root = id; return; }
    let c = m.root; while (true) { const n = m.nodes[c]; if (k < n.v) { if (n.l == null) { n.l = id; return; } c = n.l; } else { if (n.r == null) { n.r = id; return; } c = n.r; } }
  }
})();

(function () {
  const W = 860, Y0 = 44, DY = 70, AY = 342, AX0 = 38, CAPH = 15;

  }
  /* words that flip between a min-heap and a max-heap */
  const words = m => m.max
    ? { ext: 'maximum', more: 'larger', most: 'largest', wrong: 'small', not: 'smaller' }
    : { ext: 'minimum', more: 'smaller', most: 'smallest', wrong: 'big', not: 'bigger' };
  MODS.push({
    id: 'heap', group: 'ds', title: 'Heap', sub: 'push, pop, peek',
    blurb: 'A complete binary tree where every parent is smaller than its children, so the minimum is always at the root. It lives in a plain array and fixes itself by swapping up or down one level at a time. This one is a min-heap; a max-heap flips every comparison.',
    init() { return { a: [3, 8, 5, 12, 10, 9, 7].map((v, i) => ({ id: i, v })), nid: 7, max: false }; },
    view: m => scene(m),
    ops: [
      { id: 'push', label: 'Push', cx: 'Time O(log n)', fields: [{ id: 'value', label: 'Value', type: 'num', def: 4 }], code: `
void push(List<Integer> heap, int x) {
    heap.add(x);                                  ⟨app⟩
    int i = heap.size() - 1;
    while (i > 0) {
        int p = (i - 1) / 2;                      ⟨cmp⟩
        if (heap.get(i) >= heap.get(p)) break;    ⟨brk⟩
        Collections.swap(heap, i, p);             ⟨swap⟩
        i = p;
    }
}` },
      { id: 'pop', label: 'Pop', cx: 'Time O(log n)', fields: [], code: `
int pop(List<Integer> heap) {
    int top = heap.get(0);                        ⟨top⟩
    int last = heap.remove(heap.size() - 1);
    if (heap.isEmpty()) return top;               ⟨one⟩
    heap.set(0, last);                            ⟨mv⟩
    int i = 0, n = heap.size();
    while (true) {
        int l = 2*i + 1, r = 2*i + 2, m = i;
        if (l < n && heap.get(l) < heap.get(m)) m = l;    ⟨pick⟩
        if (r < n && heap.get(r) < heap.get(m)) m = r;
        if (m == i) break;                        ⟨brk⟩
        Collections.swap(heap, i, m);             ⟨swap⟩
        i = m;
    }
    return top;                                   ⟨ret⟩
}` },
      { id: 'peek', label: 'Peek', cx: 'Time O(1)', fields: [], code: `
int peek(List<Integer> heap) {
    return heap.get(0);  // the root is always the minimum   ⟨peek⟩
}` }
    ],
    run(m, op, v, R) {
      const a = m.a, sw = (i, j) => { [a[i], a[j]] = [a[j], a[i]]; }, w = words(m);
      const before = (x, y) => m.max ? x > y : x < y;
      if (op === 'push') {
        if (a.length >= CAPH) return `This demo's heap holds ${CAPH} items. Pop some first.`;
        const e = { id: m.nid++, v: v.value }; a.push(e); let i = a.length - 1;
        const p0 = tp(i);
        R.add(`Append ${e.v} at the end of the array, which is the next free spot in the bottom level.`, 'app', scene(m, { st: { [i]: 'new' }, from: { [e.id]: { t: { y: p0.y + 50 }, a: { y: AY + 60 } } } }), { i });
        while (i > 0) {

          sw(i, p);

        const top = a[0];

        if (a.length === 1) { a.pop(); R.add(`That was the only item. Return ${top.v}.`, 'one', scene(m), { returned: top.v }); return; }

/* ---------- Trie (shared drawing) ---------- */
const TRIE = (function () {
  const DXL = 48, DY = 62, Y0 = 36;
  function make(words) { const t = { nodes: { 0: { ch: '', kids: {}, end: false } }, nid: 1 }; words.forEach(wd => { let c = 0; for (const ch of wd) { if (t.nodes[c].kids[ch] == null) { t.nodes[t.nid] = { ch, kids: {}, end: false }; t.nodes[c].kids[ch] = t.nid++; } c = t.nodes[c].kids[ch]; } t.nodes[c].end = true; }); return t; }
  function layout(t, W) {
    const pos = {}; let leaf = 0, md = 0;
    (function go(id, d) {
      const ks = Object.keys(t.nodes[id].kids).sort();
      md = Math.max(md, d);
      if (!ks.length) { pos[id] = { x: leaf++ * DXL, y: Y0 + d * DY }; return; }
      ks.forEach(ch => go(t.nodes[id].kids[ch], d + 1));
      const xs = ks.map(ch => pos[t.nodes[id].kids[ch]].x);
      pos[id] = { x: (xs[0] + xs[xs.length - 1]) / 2, y: Y0 + d * DY };
    })(0, 0);
    const off = (W - (leaf - 1) * DXL) / 2; for (const id in pos) pos[id].x += off;
    return { pos, leaves: leaf, md };
  }
  function scene(t, o = {}, W = 760) {
    const { pos, md } = layout(t, W), nodes = [], edges = [], maxD = Math.max(md, 4);
    for (const id in t.nodes) {
      const n = t.nodes[id], p = pos[id];
      nodes.push(circ('n' + id, p.x, p.y, id == 0 ? '·' : n.ch, { r: 18, ring: n.end, st: (o.st || {})[id] || (id == 0 ? 'root' : ''), from: (o.from || {})[id] }));
      for (const ch in n.kids) edges.push(edge('n' + id, 'n' + n.kids[ch], { arrow: false, st: (o.est || {})[n.kids[ch]] || '' }));
    }
    const outY = Y0 + maxD * DY + 24;
    if (o.out) {
      nodes.push(txt('olbl', 20, outY, 'results', { cls: 'note', anchor: 'start' }));
      let x = 90; o.out.forEach(([wd, id]) => { const w = wd.length * 11 + 22; nodes.push(box('w' + wd, x + w / 2, outY, wd, { w, h: 34, st: 'found', from: pos[id] ? { x: pos[id].x, y: pos[id].y } : null })); x += w + 8; });
    }
    if (o.word != null) nodes.push(txt('word', 20, Y0 - 6, o.word, { cls: 'note', anchor: 'start' }));
    return { w: W, h: outY + 30, nodes, edges, pos };
  }
  const ok = s => /^[a-z]{1,8}$/.test(s);
  return { make, layout, scene, ok, DXL };
})();

function arrScene(a, o = {}) {

        if (s == target)

MODS.push({

  ops: [{ id: 'run', label: 'Longest unique', cx: 'Time O(n), space O(alphabet)', fields: [{ id: 's', label: 'Text', type: 'text', def: 'abcabcbb', wide: true }], code: `
int longestUnique(String s) {
    Set<Character> seen = new HashSet<>();

    for (int right = 0; right < s.length(); right++) {   ⟨for⟩
        while (seen.contains(s.charAt(right))) {
            seen.remove(s.charAt(left));                 ⟨rem⟩
            left++;
        }
        seen.add(s.charAt(right));

}` }],

/* ---------- shared graph for DFS / BFS ---------- */
const GPOS = { A: [300, 50], B: [160, 130], C: [440, 130], D: [80, 240], E: [230, 240], F: [370, 240], G: [520, 240], H: [300, 340] };
function parseEdges(s) {
  const E = [], seen = new Set();
  for (const tok of String(s).split(/[,;\n]+/)) {
    const t = tok.trim().toUpperCase(); if (!t) continue;
    const mm = t.match(/^([A-H])\s*-\s*([A-H])$/);
    if (!mm) throw `"${tok.trim()}" isn't an edge. Write edges like A-B, using letters A to H.`;
    if (mm[1] === mm[2]) continue;
    const k = [mm[1], mm[2]].sort().join(''); if (!seen.has(k)) { seen.add(k); E.push([mm[1], mm[2]]); }
  }
  if (!E.length) throw 'Add at least one edge, like A-B.';
  return E;
}
function adjOf(E) { const g = {}; for (const [u, w] of E) { (g[u] = g[u] || []).push(w); (g[w] = g[w] || []).push(u); } for (const k in g) g[k].sort(); return g; }
const ek = (u, w) => [u, w].sort().join('');
function gNodes(g, ns, extra) {
  const nodes = Object.keys(g).sort().map(u => circ('g' + u, GPOS[u][0], GPOS[u][1], u, { st: ns[u] || '' }));
  return nodes.concat(extra || []);
}
function gEdges(E, es) { return E.map(([u, w]) => edge('g' + u, 'g' + w, { arrow: false, st: es[ek(u, w)] || '' })); }
const GFIELDS = [{ id: 'edges', label: 'Edges', type: 'text', def: 'A-B, A-C, B-D, B-E, C-F, C-G, E-H, F-H, E-F', wide: true }, { id: 'start', label: 'Start', type: 'text', def: 'A' }];
function orderNodes(order) { return [txt('lo', 30, 412, 'visit order', { cls: 'note', anchor: 'start' })].concat(order.map((u, k) => box('o' + u, 140 + k * 46, 412, u, { w: 38, h: 34, st: 'found', from: { x: GPOS[u][0], y: GPOS[u][1] } }))); }

/* ---------- Backtracking: N-Queens ---------- */
MODS.push({
  id: 'backtracking', group: 'algo', title: 'Backtracking', sub: 'N-Queens',
  blurb: 'Build a solution one choice at a time. The moment a choice breaks a rule, undo it and try the next option. Here: place one queen per row so no two share a column or diagonal.',
  ops: [{ id: 'run', label: 'Solve', cx: 'Worst case O(n!), pruning cuts most of it', fields: [{ id: 'n', label: 'Board size', type: 'select', def: '4', options: ['4', '5', '6'] }], code: `
int n;
Set<Integer> cols = new HashSet<>(), d1 = new HashSet<>(), d2 = new HashSet<>();
List<Integer> board = new ArrayList<>();

boolean place(int r) {
    if (r == n)
        return true; // every row has a queen     ⟨done⟩
    for (int c = 0; c < n; c++) {                 ⟨try⟩
        if (cols.contains(c) || d1.contains(r - c) || d2.contains(r + c))
            continue; // attacked: skip           ⟨skip⟩
        cols.add(c); d1.add(r - c); d2.add(r + c);
        board.add(c);                             ⟨place⟩
        if (place(r + 1))
            return true;
        cols.remove(c); d1.remove(r - c); d2.remove(r + c);
        board.remove(board.size() - 1); // undo   ⟨back⟩
    }
    return false;                                 ⟨fail⟩
}` }],
  run(m, op, v, R) {
    const n = +v.n; if (![4, 5, 6].includes(n)) return 'Pick a board size of 4, 5 or 6.';
    const C = 52, X0 = 40, Y0 = 40, cx = c => X0 + c * C + C / 2, cy = r => Y0 + r * C + C / 2;
    const board = [];
    const sc = (cst = {}, qst = {}) => {
      const nodes = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) nodes.push(box(`c${r}_${c}`, cx(c), cy(r), '', { w: C, h: C, st: cst[r + '_' + c] || ((r + c) % 2 ? 'sq2' : 'sq1') }));
      board.forEach((c, r) => nodes.push(box('q' + r, cx(c), cy(r), '♛', { w: 40, h: 40, st: 'queen ' + (qst[r] || ''), from: { y: Y0 - 30 } })));
      for (let r = 0; r < n; r++) nodes.push(txt('rl' + r, X0 - 16, cy(r), r, { cls: 'idx' }));
      return { w: X0 + n * C + 40, h: Y0 + n * C + 30, nodes, edges: [] };
    };
    const vs = () => ({ board: '[' + board.join(', ') + ']' });
    const attacker = (r, c) => board.findIndex((cc, rr) => cc === c || rr - cc === r - c || rr + cc === r + c);
    const place = r => {
      if (r === n) { const q = {}; board.forEach((_, i) => q[i] = 'found'); R.add(`All ${n} rows have a queen and none attack each other. Solved.`, 'done', sc({}, q), vs()); return true; }
      for (let c = 0; c < n; c++) {
        const a = attacker(r, c);
        if (a >= 0) { R.add(`Row ${r}, column ${c}: attacked by the queen in row ${a}. Skip.`, 'skip', sc({ [r + '_' + c]: 'del' }, { [a]: 'del' }), { row: r, col: c, ...vs() }); continue; }
        board.push(c);
        R.add(`Row ${r}, column ${c} is safe. Place a queen and move on to row ${r + 1}.`, 'place', sc({}, { [r]: 'active' }), { row: r, col: c, ...vs() });
        if (place(r + 1)) return true;
        R.add(`Row ${r + 1} had no safe column, so this queen in row ${r} must move. Undo it.`, 'back', sc({}, { [r]: 'del' }), { row: r, col: c, ...vs() });
        board.pop();
      }
      R.add(`No safe column left in row ${r}. Report failure to the row above.`, 'fail', sc(), { row: r, ...vs() });
      return false;
    };
    R.add(`Place ${n} queens on a ${n}×${n} board, one row at a time, starting at row 0.`, 'try', sc(), vs());
    place(0);
  }
});

int rows, cols;

int numIslands(char[][] grid) {
    rows = grid.length; cols = grid[0].length;
    int count = 0;
    for (int r = 0; r < rows; r++)
        for (int c = 0; c < cols; c++)
            if (grid[r][c] == '1') {             ⟨scan⟩
                count++;                         ⟨count⟩
                sink(grid, r, c);
            }
    return count;                                ⟨ret⟩
}

void sink(char[][] grid, int r, int c) {
    if (r < 0 || c < 0 || r >= rows || c >= cols) return;
    if (grid[r][c] != '1') return;
    grid[r][c] = '#'; // mark as visited         ⟨mark⟩

      return { w: X0 * 2 + W * C, h: Y0 * 2 + H * C, nodes, edges: [] };

    R.add('Scan the grid row by row. Green is land, blue is water.', 'scan', sc(null), { count });
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
      if (g[r][c] !== 1 || isl[r][c]) { R.add(g[r][c] ? `(${r}, ${c}) is land already marked as island ${isl[r][c]}. Skip.` : `(${r}, ${c}) is water. Skip.`, 'scan', sc([r, c]), { r, c, count }); continue; }

      sink(r, c);

MODS.push({

List<String> autocomplete(TrieNode root, String prefix) {
    TrieNode node = root;
    for (char ch : prefix.toCharArray()) {
        if (!node.children.containsKey(ch))
            return new ArrayList<>();                 ⟨miss⟩
        node = node.children.get(ch);                 ⟨adv⟩
    }
    List<String> out = new ArrayList<>();
    collect(node, prefix, out);
    return out;                                       ⟨ret⟩
}

void collect(TrieNode n, String path, List<String> out) {
    if (n.isEnd)
        out.add(path);                                ⟨add⟩
    for (char ch : n.children.keySet())
        collect(n.children.get(ch), path + ch, out);  ⟨dfs⟩
}` }],
  run(m, op, v, R) {
    const pre = String(v.prefix || '').trim().toLowerCase();
    const words = String(v.words || '').toLowerCase().split(/[\s,]+/).filter(Boolean);
    if (!words.length || words.length > 12 || words.some(w => !TRIE.ok(w))) return 'The dictionary needs 1 to 12 words of up to 8 lowercase letters.';
    if (!/^[a-z]{0,8}$/.test(pre)) return 'The prefix should be up to 8 lowercase letters.';
    const t = TRIE.make([...new Set(words)]);
    if (TRIE.layout(t, 760).leaves > 15) return 'Those words make the trie too wide to draw. Try fewer or shorter words.';
    const st = { 0: 'visit' }, out = [];
    const sc = () => TRIE.scene(t, { st: { ...st }, out: [...out], word: `prefix "${pre}"` }, 760);
    let c = 0;
    R.add(`Start at the root and follow the letters of "${pre}".`, 'adv', sc(), { prefix: pre });
    for (const ch of pre) {
      const nx = t.nodes[c].kids[ch];
      if (nx == null) { st[c] = 'del'; R.add(`No '${ch}' below here. No word starts with "${pre}".`, 'miss', sc(), { result: '[]' }); return; }
      c = nx; st[c] = 'active';
      R.add(`Follow '${ch}'.`, 'adv', sc(), { prefix: pre });
      st[c] = 'visit';
    }
    st[c] = 'cmp';
    R.add(`Reached the "${pre}" node. Every word below it is a match. Collect them with a DFS.`, 'adv', sc(), { prefix: pre });
    const dfs = (id, path) => {
      const n = t.nodes[id]; if (id !== c) st[id] = 'active';
      if (n.end) { out.push([path, id]); R.add(`"${path}" ends here, so add it to the results.`, 'add', sc(), { found: out.length }); }
      else if (id !== c) R.add(`At "${path}", which isn't a complete word. Keep going down.`, 'dfs', sc(), { found: out.length });
      for (const ch of Object.keys(n.kids).sort()) dfs(n.kids[ch], path + ch);
      if (id !== c) st[id] = 'done';
    };
    dfs(c, pre);
    R.add(out.length ? `Done: ${out.map(x => x[0]).join(', ')}.` : 'No complete words below this prefix.', 'ret', sc(), { result: out.length });
  }
});

const LL = (function () {

  function parse(s) { const a = nums(s, 'values'); if (a.length < 2 || a.length > 8) throw 'Enter between 2 and 8 values.'; return a; }

    const st = Object.assign(Object.fromEntries([...fl].map(i => [i, 'visit'])), o.st || {});
    vals.forEach((x, i) => nodes.push(box('n' + i, px(i), Y, x, { w: NW, h: NH, st: st[i] || '' })));
    if (o.left) nodes.push(txt('nullL', L.x, L.y, 'null', { cls: 'null' }));
    const usesR = next.some((nx, i) => nx == null && !fl.has(i)) || [o.tags, o.below].some(t => t && Object.values(t).includes('R'));
    if (usesR) nodes.push(txt('nullR', Rn.x, Rn.y, 'null', { cls: 'null' }));

    nodes.push(...tagsAt(o.tags, posOf, 't_', -NH / 2 - 8));
    nodes.push(...tagsAt(o.below, posOf, 'b_', NH / 2 + 8));
    return { w: Rn.x + 50, h: 250, nodes, edges };

})();

List<Character> topoSort(Map<Character, List<Character>> graph) {

        order.add(u);                                                 ⟨poll⟩
        for (char v : graph.getOrDefault(u, List.of()))
            if (indeg.merge(v, -1, Integer::sum) == 0)
                q.offer(v);                                           ⟨dec⟩

/* ---------- LRU cache ---------- */
(function () {
  const CAP = 3, LY = 210, MY = 80, NX = i => 190 + i * 124, HX = 60, TX = NX(CAP) - 6;
  function scene(m, o = {}) {
    const nodes = [], edges = [];
    nodes.push(box('H', HX, LY, 'head', { w: 70, h: 40, st: 'bucket' }), box('T', TX, LY, 'tail', { w: 70, h: 40, st: 'bucket' }));
    nodes.push(txt('lmru', HX, LY + 40, 'most recent', { cls: 'note' }), txt('llru', TX, LY + 40, 'least recent', { cls: 'note' }));
    nodes.push(txt('lmap', 20, MY - 40, 'hash map: key → node', { cls: 'note', anchor: 'start' }), txt('llist', 20, LY - 62, 'doubly linked list', { cls: 'note', anchor: 'start' }));
    const list = m.list.filter(e => !(o.det && o.det.id === e.id));
    const place = (e, x, y) => {
      nodes.push(box('n' + e.id, x, y, `${e.k}: ${e.v}`, { w: 84, h: 40, st: (o.st || {})[e.id] || '' }));
      if (!(o.nomap && o.nomap === e.id)) { nodes.push(box('m' + e.id, x, MY, `key ${e.k}`, { w: 76, h: 32, st: (o.mst || {})[e.id] || '' })); edges.push(edge('m' + e.id, 'n' + e.id, { st: (o.mst || {})[e.id] === 'found' ? 'cmp' : '' })); }
    };
    list.forEach((e, i) => place(e, NX(i), LY));
    if (o.det) place(o.det, o.detX, LY + 90);
    const chain = ['H', ...list.map(e => 'n' + e.id), 'T'];
    for (let i = 0; i + 1 < chain.length; i++) { const es = (o.link || {})[chain[i]] || ''; edges.push(edge(chain[i], chain[i + 1], { curve: -9, st: es }), edge(chain[i + 1], chain[i], { curve: -9, st: es })); }
    return { w: TX + 60, h: LY + 140, nodes, edges };
  }
  const vars = (m, extra) => ({ order: m.list.map(e => e.k).join(' → ') || '(empty)', size: `${m.list.length}/${CAP}`, ...(extra || {}) });
  function toFront(m, e, R, line, why) {
    const idx = m.list.indexOf(e);
    if (idx === 0) { R.add(`${why} Key ${e.k} is already the most recent, so nothing moves.`, line, scene(m, { st: { [e.id]: 'found' }, mst: { [e.id]: 'found' } }), vars(m)); return; }
    R.add(`${why} Unlink the node: its neighbors now point at each other. That's O(1) because the node knows both its prev and next.`, line, scene(m, { det: e, detX: NX(idx), st: { [e.id]: 'active' }, mst: { [e.id]: 'found' }, link: { ['n' + (m.list[idx - 1] || {}).id]: 'new' } }), vars(m));
    m.list.splice(idx, 1); m.list.unshift(e);
    R.add(`Insert it right after head. Key ${e.k} is now the most recently used.`, line, scene(m, { st: { [e.id]: 'found' }, link: { H: 'new', ['n' + e.id]: 'new' } }), vars(m));
  }
  MODS.push({
    id: 'lru', group: 'ds', title: 'LRU cache', sub: 'get and put in O(1)',
    blurb: `A cache with room for ${CAP} entries that evicts the least recently used one. A hash map finds any node in O(1); a doubly linked list keeps nodes in order of use, so moving a node to the front or dropping the oldest from the back is also O(1). Changes carry over between runs.`,
    init() { return { list: [{ id: 0, k: 3, v: 30 }, { id: 1, k: 2, v: 20 }, { id: 2, k: 1, v: 10 }], nid: 3 }; },
    view: m => scene(m),
    code: `
class LRUCache {
    Map<Integer, Node> map = new HashMap<>();
    Node head = new Node(), tail = new Node();  // sentinels
    int cap;

    int get(int key) {
        Node n = map.get(key);                         ⟨look⟩
        if (n == null) return -1;                      ⟨miss⟩
        moveToFront(n);   // just used                 ⟨move⟩
        return n.val;                                  ⟨hit⟩
    }

    void put(int key, int val) {
        Node n = map.get(key);                         ⟨plook⟩
        if (n != null) { n.val = val; moveToFront(n); return; }  ⟨update⟩
        if (map.size() == cap) {
            Node lru = tail.prev;   // least recently used  ⟨evict⟩
            unlink(lru);
            map.remove(lru.key);
        }
        n = new Node(key, val);
        addAfterHead(n);                               ⟨add⟩
        map.put(key, n);
    }
    // unlink(n):       n.prev.next = n.next; n.next.prev = n.prev;
    // addAfterHead(n): n.next = head.next; n.prev = head;
    //                  head.next.prev = n; head.next = n;
    // moveToFront(n):  unlink(n); addAfterHead(n);
}`,
    ops: [
      { id: 'get', label: 'get(key)', cx: 'Time O(1)', fields: [{ id: 'key', label: 'Key', type: 'num', def: 1 }] },
      { id: 'put', label: 'put(key, value)', cx: 'Time O(1)', fields: [{ id: 'key', label: 'Key', type: 'num', def: 4 }, { id: 'val', label: 'Value', type: 'num', def: 40 }] }
    ],
    run(m, op, v, R) {
      const k = v.key; if (!Number.isInteger(k) || k < 0 || k > 99) return 'Use a whole-number key from 0 to 99.';
      const e = m.list.find(x => x.k === k);
      if (op === 'get') {
        R.add(`get(${k}): look up key ${k} in the hash map.`, 'look', scene(m, e ? { mst: { [e.id]: 'found' }, st: { [e.id]: 'cmp' } } : {}), vars(m, { key: k }));
        if (!e) { R.add(`Key ${k} isn't cached. Return -1 and change nothing.`, 'miss', scene(m), vars(m, { result: -1 })); return; }
        toFront(m, e, R, 'move', `Found it. Reading counts as a use.`);
        R.add(`Return ${e.v}.`, 'hit', scene(m, { st: { [e.id]: 'found' } }), vars(m, { result: e.v }));
      } else {
        const val = v.val; if (!Number.isInteger(val) || Math.abs(val) > 999) return 'Use a whole-number value between -999 and 999.';
        R.add(`put(${k}, ${val}): first check whether key ${k} is already cached.`, 'plook', scene(m, e ? { mst: { [e.id]: 'found' }, st: { [e.id]: 'cmp' } } : {}), vars(m, { key: k }));
        if (e) { e.v = val; toFront(m, e, R, 'update', `It is. Update its value to ${val}.`); return; }
        if (m.list.length >= CAP) {
          const lru = m.list[m.list.length - 1];
          R.add(`The cache is full (${CAP}/${CAP}). The least recently used entry sits just before tail: key ${lru.k}. Evict it from the list and the map.`, 'evict', scene(m, { st: { [lru.id]: 'del' }, mst: { [lru.id]: 'del' } }), vars(m, { evict: lru.k }));
          m.list.pop();
        }
        const ne = { id: m.nid++, k, v: val }; m.list.unshift(ne);
        R.add(`Create node ${k}: ${val}, insert it right after head, and add key ${k} to the map.`, 'add', scene(m, { st: { [ne.id]: 'new' }, mst: { [ne.id]: 'new' }, link: { H: 'new', ['n' + ne.id]: 'new' } }), vars(m));
      }
    }
  });
})();

    try { localStorage.setItem('trace-mod', id); } catch (e) { }
    document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
    $('#mnav').value = id;
    $('#title').textContent = mod.title;
    $('#blurb').textContent = mod.blurb;
    $('#kind').textContent = { ds: 'Data structure, built from scratch', java: 'Java built-in', algo: 'Algorithm pattern' }[mod.group];
    $('#codehead').textContent = mod.group === 'java' ? 'Java: java.util' : mod.group === 'ds' ? 'Java: built from scratch' : 'Java';
    const sp = mod.spot || [];
    $('#spot').hidden = !sp.length;
    $('#spotH').textContent = mod.group === 'algo' ? 'How to spot it' : 'When to use it';
    $('#spotL').innerHTML = sp.map(x => `<li>${esc(x)}</li>`).join('');
    const tw = mod.twin && MODS.find(x => x.id === mod.twin), tb = $('#twin');
    tb.hidden = !tw;
    if (tw) { tb.textContent = mod.group === 'java' ? `How it works inside: ${tw.title}` : `Java built-in version: ${tw.title}`; tb.onclick = () => selectMod(tw.id); }
    $('#resetData').hidden = !mod.init;
    if (mod.init && !models[id]) models[id] = mod.init();
    const tabs = $('#opTabs'); tabs.innerHTML = '';
    tabs.hidden = mod.ops.length < 2;
    mod.ops.forEach(o => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = o.label; b.setAttribute('role', 'tab');
      b.onclick = () => selectOp(o.id, true); b.dataset.op = o.id; tabs.appendChild(b);
    });
    clearStage();
    selectOp(mod.ops[0].id, false);
  }
  function selectOp(id, userClick) {
    op = mod.ops.find(o => o.id === id);
    document.querySelectorAll('#opTabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.op === id ? 'true' : 'false'));
    const f = $('#fields'); f.innerHTML = '';
    const lv = lastVals[mod.id + '.' + id] || {};
    op.fields.forEach(fd => {
      const w = document.createElement('label'); w.className = 'fld' + (fd.wide ? ' wide' : '') + (fd.type === 'area' ? ' area' : '');
      const sp = document.createElement('span'); sp.textContent = fd.label; w.appendChild(sp);
      let inp;
      if (fd.type === 'select') { inp = document.createElement('select'); fd.options.forEach(o => { const x = document.createElement('option'); x.value = o; x.textContent = o; inp.appendChild(x); }); }
      else if (fd.type === 'area') { inp = document.createElement('textarea'); inp.rows = 5; inp.spellcheck = false; }
      else { inp = document.createElement('input'); inp.type = fd.type === 'num' ? 'number' : 'text'; inp.spellcheck = false; inp.autocomplete = 'off'; }
      inp.value = lv[fd.id] != null ? lv[fd.id] : fd.def; inp.dataset.f = fd.id;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && fd.type !== 'area') { e.preventDefault(); runOp(); } });
      w.appendChild(inp); f.appendChild(w);
    });
    $('#cx').textContent = op.cx || '';
    $('#run').textContent = op.fields.length ? `Run ${op.label.toLowerCase()}` : op.label;
    const pc = parseCode(op.code || mod.code);
    $('#code').innerHTML = pc.lines.map((l, i) => `<div class="ln${pc.ops[op.id] === i ? ' cur' : ''}"><span class="no">${i + 1}</span><span class="src">${hl(l)}</span></div>`).join('');
    $('#err').textContent = '';
    if (mod.init) {
      steps = [{ cap: 'Pick an operation, set its values, and press Run. Changes carry over between runs, so you can build up the structure step by step.', line: -1, scene: mod.view(models[mod.id]), vars: null }];
      go(0, !userClick);
    } else runOp(true);
  }
  function readVals() {
    const v = {};
    for (const fd of op.fields) {
      const el = document.querySelector(`#fields [data-f="${fd.id}"]`);
      if (fd.type === 'num') { if (el.value.trim() === '' || !Number.isFinite(+el.value)) throw `Enter a number for "${fd.label}".`; v[fd.id] = +el.value; }
      else v[fd.id] = el.value;
    }
    return v;
  }
  function runOp(initial) {
    setPlaying(false);
    $('#err').textContent = '';
    let v; try { v = readVals(); } catch (e) { $('#err').textContent = e; return; }
    const model = mod.init ? models[mod.id] : {};
    const backup = mod.init ? structuredClone(model) : null;
    const R = Rec(op.code || mod.code, op.id);
    let res;
    try { res = mod.run(model, op.id, v, R); }
    catch (e) { if (backup) models[mod.id] = backup; res = typeof e === 'string' ? e : 'Something went wrong with that input. Try different values.'; if (typeof e !== 'string') console.error(e); }
    if (typeof res === 'string') { if (backup) models[mod.id] = backup; $('#err').textContent = res; return; }
    lastVals[mod.id + '.' + op.id] = Object.fromEntries(op.fields.map(fd => [fd.id, document.querySelector(`#fields [data-f="${fd.id}"]`).value]));
    steps = R.steps;
    if (initial === true) { clearStage(); go(0, true); }
    else { go(0); if (steps.length > 1) setTimeout(() => setPlaying(true), 120); }
  }
  function hl(line) {
    const ci = line.indexOf('//');
    const code = ci >= 0 ? line.slice(0, ci) : line, com = ci >= 0 ? line.slice(ci) : '';
    const re = /("[^"]*"|'[^']'|\b(?:int|char|boolean|void|static|final|new|for|if|else|while|return|true|false|null|break|continue|throw|class|public|private)\b|\b[A-Z]\w*\b|\b\d+\b)/g;
    let out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index));
      const t = m[0], c = /^["']/.test(t) ? 's' : /^\d/.test(t) ? 'd' : /^[A-Z]/.test(t) ? 't' : 'k';
      out += `<b class="${c}">${esc(t)}</b>`; last = m.index + t.length;
    }
    out += esc(code.slice(last));
    if (com) out += `<b class="c">${esc(com)}</b>`;
    return out || ' ';
  }
  /* ---------- wiring ---------- */
  buildNav();
  $('#run').onclick = () => runOp();
  $('#resetData').onclick = () => { models[mod.id] = mod.init(); selectOp(op.id, true); };
  $('#first').onclick = () => { setPlaying(false); go(0); };
  $('#prev').onclick = () => { setPlaying(false); go(idx - 1); };
  $('#next').onclick = () => { setPlaying(false); go(idx + 1); };
  $('#last').onclick = () => { setPlaying(false); go(steps.length - 1); };
  $('#play').onclick = () => setPlaying(!playing);
  $('#speed').oninput = e => { dur = SPEEDS[+e.target.value - 1]; document.documentElement.style.setProperty('--dur', dur + 'ms'); if (playing) loop(); };
  document.documentElement.style.setProperty('--dur', dur + 'ms');
  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') { setPlaying(false); go(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { setPlaying(false); go(idx - 1); e.preventDefault(); }
    else if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') { setPlaying(!playing); e.preventDefault(); }
  });
  let start = MODS[0].id; try { const s = localStorage.getItem('trace-mod'); if (s && MODS.some(m => m.id === s)) start = s; } catch (e) { }
  selectMod(start);
})();


</script>
